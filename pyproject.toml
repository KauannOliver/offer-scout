[project]
name = "money-extra"
version = "0.1.0"
description = "Local intelligence and automation platform for Mercado Livre affiliate offers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "redis>=6.2,<7",
  "celery[redis]>=5.5,<6",
  "playwright>=1.54,<2",
  "aiogram>=3.21,<4",
  "pillow>=11.3,<12",
  "beautifulsoup4>=4.13,<5",
  "lxml>=6,<7",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=25.1,<26",
  "itsdangerous>=2.2,<3",
  "structlog>=25.4,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008", "ASYNC240"]
