[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:init-permissions]
command=/bin/sh -c "chown -R app:app /data && find /data/browser-profile -maxdepth 1 -type l -name 'Singleton*' -delete"
startsecs=0
autorestart=false
priority=5

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x1000x24 -ac
autorestart=true
priority=10

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost
autorestart=true
priority=30

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 7900 localhost:5900
autorestart=true
priority=40

[program:chrome]
command=/usr/local/bin/money-extra-chromium --no-sandbox --disable-dev-shm-usage --disable-crash-reporter --no-first-run --no-default-browser-check --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --user-data-dir=/data/browser-profile about:blank
environment=DISPLAY=":99",HOME="/home/app",XDG_CONFIG_HOME="/home/app/.config",XDG_CACHE_HOME="/home/app/.cache"
user=app
autorestart=true
priority=45

[program:celery]
directory=/app
command=/app/.venv/bin/celery -A backend.app.worker.celery_app worker -Q browser --loglevel=INFO --concurrency=1
environment=DISPLAY=":99",HOME="/home/app",XDG_CONFIG_HOME="/home/app/.config",XDG_CACHE_HOME="/home/app/.cache"
user=app
autorestart=true
priority=50
